<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>grouping selectors | descendant selector | child selector</title>
    <style>
        h1,h2,h3{
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: violet;

        }
        div p{
            font-family: 'Times New Roman', Times, serif;
            color: darkgoldenrod;
        }
        ul>li{
            list-style-type: square;
            color: mediumseagreen;

        }
    </style>
</head>
<body>
    <h1>developer</h1>
    <h2>html</h2>
    <h3>css</h3>
    <div>
        <p> this paragraph is a depict of div tag</p>
    </div>
    <p>this  is another paragraph</p>
    <p>child selector</p>
    <p>selector</p>
    <ul>
        <li>element selector</li>
        <li>decsendant selector</li>
        <li>child selector</li>
        <li>many more...</li>
    </ul>
</body>
</html>
