<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS colors</title>
    <style>
        .named{
            color:aqua ;
        }
        .hex{
            color:#ff0056 ;
        }
        .rgb{
            color: rgba(red, green, blue, grey);
        }
        .hsl{
            color: hsla(10, 40, 50 , 1);
        }
        .grad{
            background-image:linear-gradient(red,blue) ;
              -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
            display: inline-block;
        }
    </style>
</head>
<body>
    <p>css colors</p>
    <ol>
        <li class="named">named color</li>
        <li class="hex">HEX color</li>
        <li class="rgb">RGB & RGBA</li>
        <li class="hsl">HSL & HSLA</li>
        <li class="grad">gradient color</li>
    </ol>
</body>
</html>
