<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sibling selector</title>
    <style>
        h2+p+p+h2{
            color: chartreuse;
        }
        input[type="text"]{
            border: 3px solid burlywood;
        }
        /* psuedo class selector */
        input:focus{
            border: 4px solid blueviolet;
        }
        a:hover{
            background-color: lightblue;

        }
        p::first-letter{
            font-size: 200%;
        }
    </style>
</head>
<body>
    <h2>sibling selector</h2>
    <p>sibling selector:selects the elements which are next to each other</p>
    <p>next paragraph</p>
    <h2>other paragraph</h2>
    <a href="#">click here</a>
    <input type="text" name="" id="" placeholder="email username">
</body>
</html>
