<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>unordered list</title>
</head>
<body>
    <ul style="list-style-type: lower-latin;">
        <li>one</li>
        <li>two</li>
        <li>three</li>
    </ul>
    <ol style="list-style-type: georgian;">
        <li>Bangalore</li>
        <li>Chennai</li>
        <li>Hyderabad</li>
        <li>delhi</li>
    </ol>
    <ol start="1">
        <li>Bangalore</li>
        <li>Chennai</li>
        <li>Hyderabad</li>
        <li>delhi</li>
    </ol>
    <ol type="a">
        <li>Bangalore</li>
        <li>Chennai</li>
        <li>Hyderabad</li>
        <li>delhi</li>
    </ol>
</body>
</html>
