<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML forms 2</title>
</head>
<body>
    <form action="" method="post">
        <fieldset>
            <legend>personal information</legend>
            <p>
                <input type="text" name="fullname" id="fullname" placeholder="enter full name">
            </p>
             <p>
                <input type="email" name="email" id="email" placeholder="enter email">
            </p>
             <p>
                <input type="password" name="mypassword" id="mypassword" placeholder="enter password">
            </p>
             <p>
                <input type="number" name="age" id="age" placeholder="enter age" min="1" max="100">
            </p>
        </fieldset>
        <fieldset>
            <legend>perferences</legend>
            <p>gender</p>
            <input type="radio" name="gender" id="male" value="male">
            <label for="male">MALE</label>
             <input type="radio" name="gender" id="female" value="female">
            <label for="female">FEMALE</label>
            <p>skills</p>
            <input type="checkbox" name="skills" id="html" value="html">
            <label for="html">html</label>
            <input type="checkbox" name="skills" id="css" value="css">
            <label for="css">css</label>
            <input type="checkbox" name="skills" id="java" value="java">
            <label for="java">java</label>
            <p>
                <label for="country">Country:</label><br>
                <select name="country" id="country">
                    <option value="">Select your country</option>
                    <option value="india">India</option>
                    <option value="usa">usa</option>
                    <option value="france">France</option>
                </select>

            </p>
            <p>
                <label for="message">Message:</label><br>
                <textarea name="message" id="message" row="4" cols="30"></textarea>
            </p>
        </fieldset>
         <p>
            <input type="submit" value="Submit">
            <input type="reset" value="Reset">
         </p>

    </form>
</body>
</html>
